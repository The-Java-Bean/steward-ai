{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Log in</h1>
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ form_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username <input name="username" value="{{ username or '' }}" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Log in</button>
  </form>
  <p class="hint">Forgot your password? Run <code>steward user reset-password</code> on the server.</p>
</section>
{% endblock %}
