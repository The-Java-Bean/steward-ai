{% extends "base.html" %}
{% block title %}Confirm your password{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Confirm your password</h1>
  <p>This step needs your password again. You can change how often you're asked in Settings.</p>
  <form method="post" action="/reauth">
    <input type="hidden" name="csrf_token" value="{{ form_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Password <input name="password" type="password" autocomplete="current-password" required autofocus></label>
    <button type="submit">Continue</button>
  </form>
</section>
{% endblock %}
