{% extends "public.html" %}
{% block title %}Password needed{% endblock %}
{% block content %}
<div class="narrow card">
  <h1>This link needs a password</h1>
  <form method="post" action="{{ action }}">
    <input type="hidden" name="csrf_token" value="{{ form_token }}">
    <label>Password <input type="password" name="password" autocomplete="off" required autofocus maxlength="1024"></label>
    <button type="submit">Open</button>
  </form>
</div>
{% endblock %}
