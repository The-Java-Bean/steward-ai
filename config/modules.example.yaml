#      ocr_dpi: 300
#      ocr_min_chars: 20  # PDF pages with less text than this are OCR'd
#      ocr_max_pages: 500
#      ocr_timeout_s: 900 # time OCR of one document may take
#      ocr_memory_mib: 1536
