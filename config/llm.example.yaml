# llm.yaml: model servers and the roles mapped to them. Optional: without it
# steward-ai runs with no model, and features that need one stay off.
config_version: 1

endpoints:
  local:
    # Any OpenAI-compatible API (Ollama, llama.cpp server, vLLM, LocalAI...).
    base_url: http://<model-server>:11434/v1
    # Required. `local` endpoints may receive local-only content. `remote` endpoints
    # never do, and need the remote_llm module (not available yet).
    trust: local
    # api_key_env: LOCAL_LLM_KEY   # name of an environment variable, never the key
    timeout_s: 600
    max_concurrency: 2

roles:
  chat:
    endpoint: local
    model: <chat-model>
    context: 8192
  embed:
    # Used by the `search` module to find documents by meaning. Changing the model,
    # `dims` or `document_prefix` embeds everything again (in the background).
    endpoint: local
    model: <embedding-model>
    dims: 768
    # Some embedding models want an instruction in front of queries or documents;
    # see the model's documentation. Leave empty otherwise.
    # query_prefix: "Instruct: Given a search query, retrieve relevant documents\nQuery: "
    # document_prefix: ""
    # Files whose closest passage is less similar to the query than this (cosine,
    # -1..1) aren't shown as matches by meaning. Depends on the model.
    min_similarity: 0.40
  caption:
    # Used by the `photos` module to describe photos so they can be searched. Needs a
    # vision model (one that accepts images). Changing the model describes every photo
    # again (in the background); expect a few seconds per photo on a GPU.
    endpoint: local
    model: <vision-model>
    capabilities: [vision]
    # Reasoning ("thinking") models: `none` describes photos several times faster and
    # keeps the reasoning from using up the answer. Any chat role can set it
    # (default | none | low | medium | high; sent as `reasoning_effort`).
    reasoning: none
  fields:
    # Used by the `fields` module to read facts from documents (type, title, date,
    # sender, amount…) with structured output. A small instruction model does well.
    endpoint: local
    model: <chat-model>
    reasoning: none
  apply_tags:
    # Used by the `tags` module to choose tags for files from your vocabulary.
    endpoint: local
    model: <chat-model>
    reasoning: none
  generate_tags:
    # Used once by `steward tags bootstrap` to suggest a first vocabulary from samples
    # of your files; a larger model gives better tags. Optional.
    endpoint: local
    model: <chat-model>
  # Run `steward models list` to see which roles the enabled modules use, and
  # `steward models probe` to test the mapped models.
