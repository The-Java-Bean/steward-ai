# Example Docker Compose file for steward-ai.
#
#   cp deploy/compose.example.yaml compose.yaml
#   cp deploy/example.env .env          # then edit .env
#   docker compose up -d
#
# Then open http://<your-server>:8420/setup and paste the setup token from:
#   docker compose logs steward-api | grep "setup token"
#
# NOTE: pre-alpha. `steward api` migrates the databases when it starts; the worker
# waits for that (it exits if the databases aren't current, and restarts).
#
# Each library is ONE bind mount: read-write for steward-api (only its executor lane
# writes), read-only for steward-worker. Don't split a library into several mounts:
# moves between separate mounts fail even on the same disk.

services:
  steward-api:
    image: steward:${STEWARD_VERSION:-dev}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["steward", "api"]
    ports:
      - "${STEWARD_PORT:-8420}:8420"
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./config:/config
      - ${STEWARD_DATA:-./data}:/data
      - ${LIBRARY_1:?set LIBRARY_1 in .env}:/libraries/main
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8420/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  steward-worker:
    image: steward:${STEWARD_VERSION:-dev}
    command: ["steward", "worker"]
    depends_on:
      steward-api:
        condition: service_healthy
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./config:/config:ro
      - ${STEWARD_DATA:-./data}:/data
      - ${LIBRARY_1:?set LIBRARY_1 in .env}:/libraries/main:ro
    deploy:
      resources:
        limits: { cpus: "4", memory: 4g }
    restart: unless-stopped
