[project]
name = "steward-ai"
version = "0.1.0.dev0"
description = "A self-hosted AI steward for the files on your server."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "blake3>=1.0",
    "cryptography>=44",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "pydantic>=2.11",
    "pypdf>=6",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "typer>=0.16",
    "uvicorn>=0.54.0",
    "watchdog>=6.0",
]

[project.scripts]
steward = "steward.cli:app"

# Built-in modules are registered exactly like out-of-tree ones (see docs/modules.md).
[project.entry-points."steward.modules"]
documents = "steward.modules.documents:DocumentsModule"
files_ui = "steward.modules.files_ui:FilesUiModule"
shares = "steward.modules.shares:SharesModule"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "import-linter>=2.3",
    "mypy>=1.17",
    "pip-licenses>=5.0",
    "pytest>=8.4",
    "ruff>=0.12",
    "steward-hello",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv.workspace]
members = ["examples/hello-module"]

[tool.uv.sources]
steward-hello = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "steward"

# --- lint / types / tests -----------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "RUF043"]  # asserts; test passwords; plain match=
"scripts/**" = ["S603", "S607"]  # fixed git commands, no user input
"src/steward/modules/shares/**" = ["S105", "S107"]  # "password_change" modes, not passwords

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "examples/hello-module/src", "scripts"]
mypy_path = "tests"
plugins = ["pydantic.mypy"]
exclude = ["src/steward/core/db/(versions|alembic)/", "/migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
pythonpath = ["tests"]
markers = ["live: calls real model endpoints (opt in with -m live)"]

# --- architecture contracts (lint-imports) ------------------------------------

[tool.importlinter]
root_packages = ["steward", "steward_hello"]

[[tool.importlinter.contracts]]
name = "The SDK depends on nothing else in steward"
type = "forbidden"
source_modules = ["steward.sdk"]
forbidden_modules = ["steward.core", "steward.api", "steward.modules", "steward.cli"]

[[tool.importlinter.contracts]]
name = "Built-in modules use only the SDK"
type = "forbidden"
source_modules = ["steward.modules"]
forbidden_modules = ["steward.core", "steward.api", "steward.cli"]

[[tool.importlinter.contracts]]
name = "Out-of-tree modules use only the SDK"
type = "forbidden"
source_modules = ["steward_hello"]
forbidden_modules = ["steward.core", "steward.api", "steward.modules", "steward.cli"]

[[tool.importlinter.contracts]]
name = "The core never imports modules directly (they are discovered)"
type = "forbidden"
source_modules = ["steward.core"]
forbidden_modules = ["steward.modules", "steward.api", "steward.cli", "steward_hello"]
