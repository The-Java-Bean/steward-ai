[project]
name = "steward-ai"
version = "0.1.0.dev0"
description = "A self-hosted AI steward for the files on your server."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "typer>=0.16",
]

[project.scripts]
steward = "steward.cli:app"

# Built-in modules will be listed under [project.entry-points."steward.modules"],
# registered exactly like out-of-tree ones (see docs/modules.md). None exist yet.

[dependency-groups]
dev = [
    "import-linter>=2.3",
    "mypy>=1.17",
    "pip-licenses>=5.0",
    "pytest>=8.4",
    "ruff>=0.12",
    "steward-hello",
]

[tool.uv.workspace]
members = ["examples/hello-module"]

[tool.uv.sources]
steward-hello = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "steward"

# --- lint / types / tests -----------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S603", "S607"]  # fixed git commands, no user input

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "examples/hello-module/src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = ["live: calls real model endpoints (opt in with -m live)"]

# --- architecture contracts (lint-imports) ------------------------------------

[tool.importlinter]
root_packages = ["steward", "steward_hello"]

[[tool.importlinter.contracts]]
name = "The SDK depends on nothing else in steward"
type = "forbidden"
source_modules = ["steward.sdk"]
forbidden_modules = ["steward.core", "steward.modules", "steward.cli"]

[[tool.importlinter.contracts]]
name = "Built-in modules use only the SDK"
type = "forbidden"
source_modules = ["steward.modules"]
forbidden_modules = ["steward.core", "steward.cli"]

[[tool.importlinter.contracts]]
name = "Out-of-tree modules use only the SDK"
type = "forbidden"
source_modules = ["steward_hello"]
forbidden_modules = ["steward.core", "steward.modules", "steward.cli"]

[[tool.importlinter.contracts]]
name = "The core never imports modules directly (they are discovered)"
type = "forbidden"
source_modules = ["steward.core"]
forbidden_modules = ["steward.modules", "steward.cli", "steward_hello"]
